<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a: #eef2ff;
    --bg-b: #f5f3ff;
    --card: #ffffff;
    --text: #1e1b2e;
    --muted: #7c7a8d;
    --primary: #6366f1;
    --primary-2: #8b5cf6;
    --primary-hover: #4f46e5;
    --border: #ececf3;
    --done: #10b981;
    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --shadow: 0 4px 24px rgba(76, 61, 145, 0.08);
    --shadow-hover: 0 8px 28px rgba(76, 61, 145, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at 10% 0%, var(--bg-a), transparent 55%),
                radial-gradient(circle at 90% 10%, var(--bg-b), transparent 50%),
                #f7f7fb;
    color: var(--text);
    padding: 40px 16px 80px;
  }
  .wrap { max-width: 620px; margin: 0 auto; }

  .hero {
    text-align: center;
    margin-bottom: 32px;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 6px 18px rgba(99, 102, 241, 0.35);
    font-size: 1.5rem;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 1.9rem;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  p.subtitle { color: var(--muted); margin: 0; font-size: 0.95rem; }

  .progreso {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px auto 0;
    max-width: 280px;
  }
  .progreso-barra {
    flex: 1;
    height: 6px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .progreso-barra-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    transition: width 0.35s ease;
    width: 0%;
  }
  .progreso-texto {
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
    font-weight: 600;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--card);
    padding: 20px;
    border-radius: 18px;
    box-shadow: var(--shadow);
    margin: 28px 0 24px;
    border: 1px solid var(--border);
  }
  input[type=text], textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #fbfbfe;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  input[type=text]:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
  }
  textarea { resize: vertical; min-height: 44px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: inherit;
    transition: transform 0.1s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: white;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99, 102, 241, 0.45); }
  .btn-primary:active:not(:disabled) { transform: translateY(0); }
  .btn-primary:disabled { background: #c7c6e8; box-shadow: none; cursor: not-allowed; }

  ul#lista { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  li.tarea {
    background: var(--card);
    border-radius: 14px;
    padding: 16px 16px 16px 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: box-shadow 0.15s ease, border-left-color 0.2s ease, opacity 0.2s ease;
    animation: aparecer 0.25s ease;
  }
  li.tarea:hover { box-shadow: var(--shadow-hover); }
  li.tarea.completada { border-left-color: var(--done); opacity: 0.62; }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .checkbox-custom {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 2px solid var(--border);
    margin-top: 2px;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .checkbox-custom:hover { border-color: var(--primary); }
  .checkbox-custom:checked {
    background: var(--done);
    border-color: var(--done);
  }
  .checkbox-custom:checked::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 2px;
    width: 5px;
    height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .tarea-info { flex: 1; min-width: 0; }
  .tarea-titulo { font-weight: 650; word-break: break-word; transition: color 0.15s ease; }
  .tarea-titulo.completada { text-decoration: line-through; color: var(--muted); }
  .tarea-desc { color: var(--muted); font-size: 0.87rem; margin-top: 3px; word-break: break-word; line-height: 1.4; }
  .tarea-fecha { color: #b3b1c4; font-size: 0.73rem; margin-top: 8px; font-weight: 500; }

  .btn-eliminar {
    background: transparent;
    color: var(--danger);
    padding: 6px 10px;
    font-size: 0.82rem;
    font-weight: 600;
    flex-shrink: 0;
    border-radius: 8px;
  }
  .btn-eliminar:hover { background: var(--danger-bg); }

  #vacio {
    text-align: center;
    padding: 48px 16px;
    color: var(--muted);
  }
  #vacio .emoji { font-size: 2.4rem; display: block; margin-bottom: 10px; }
  #vacio .titulo-vacio { font-weight: 700; color: var(--text); margin-bottom: 4px; }

  #error {
    color: var(--danger);
    font-size: 0.88rem;
    margin-bottom: 12px;
    display: none;
    background: var(--danger-bg);
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: 500;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.75rem;
    color: #c4c2d6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="hero-badge">✅</div>
      <h1>Task Manager</h1>
      <p class="subtitle">Organizá tu día, una tarea a la vez</p>
      <div class="progreso">
        <div class="progreso-barra"><div class="progreso-barra-fill" id="barra-fill"></div></div>
        <span class="progreso-texto" id="progreso-texto">0/0</span>
      </div>
    </div>

    <div id="error"></div>

    <form id="form-nueva">
      <input type="text" id="input-titulo" placeholder="¿Qué hay que hacer?" required maxlength="200">
      <textarea id="input-descripcion" placeholder="Descripción (opcional)"></textarea>
      <button type="submit" class="btn-primary" id="btn-agregar">+ Agregar tarea</button>
    </form>

    <ul id="lista"></ul>
    <div id="vacio" style="display:none;">
      <span class="emoji">🌤️</span>
      <div class="titulo-vacio">No hay tareas todavía</div>
      <div>¡Agregá la primera arriba!</div>
    </div>

    <footer>Task Manager · FastAPI + MongoDB</footer>
  </div>

<script>
  const API = "/tareas/";

  const lista = document.getElementById("lista");
  const vacio = document.getElementById("vacio");
  const errorBox = document.getElementById("error");
  const form = document.getElementById("form-nueva");
  const inputTitulo = document.getElementById("input-titulo");
  const inputDescripcion = document.getElementById("input-descripcion");
  const btnAgregar = document.getElementById("btn-agregar");
  const barraFill = document.getElementById("barra-fill");
  const progresoTexto = document.getElementById("progreso-texto");

  function mostrarError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
    setTimeout(() => { errorBox.style.display = "none"; }, 4000);
  }

  function formatearFecha(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch { return ""; }
  }

  function actualizarProgreso(tareas) {
    const total = tareas.length;
    const hechas = tareas.filter(t => t.completada).length;
    progresoTexto.textContent = `${hechas}/${total}`;
    barraFill.style.width = total === 0 ? "0%" : `${(hechas / total) * 100}%`;
  }

  function crearElementoTarea(tarea) {
    const li = document.createElement("li");
    li.className = "tarea" + (tarea.completada ? " completada" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className = "checkbox-custom";
    checkbox.checked = tarea.completada;
    checkbox.addEventListener("change", () => actualizarCompletada(tarea.id, checkbox.checked));

    const info = document.createElement("div");
    info.className = "tarea-info";

    const titulo = document.createElement("div");
    titulo.className = "tarea-titulo" + (tarea.completada ? " completada" : "");
    titulo.textContent = tarea.titulo;
    info.appendChild(titulo);

    if (tarea.descripcion) {
      const desc = document.createElement("div");
      desc.className = "tarea-desc";
      desc.textContent = tarea.descripcion;
      info.appendChild(desc);
    }

    const fecha = document.createElement("div");
    fecha.className = "tarea-fecha";
    fecha.textContent = formatearFecha(tarea.creada_en);
    info.appendChild(fecha);

    const btnEliminar = document.createElement("button");
    btnEliminar.className = "btn-eliminar";
    btnEliminar.textContent = "Eliminar";
    btnEliminar.addEventListener("click", () => eliminarTarea(tarea.id));

    li.appendChild(checkbox);
    li.appendChild(info);
    li.appendChild(btnEliminar);
    return li;
  }

  async function cargarTareas() {
    try {
      const resp = await fetch(API);
      if (!resp.ok) throw new Error("No se pudieron cargar las tareas");
      const tareas = await resp.json();
      lista.innerHTML = "";
      actualizarProgreso(tareas);
      if (tareas.length === 0) {
        vacio.style.display = "block";
      } else {
        vacio.style.display = "none";
        tareas
          .sort((a, b) => new Date(b.creada_en) - new Date(a.creada_en))
          .forEach(t => lista.appendChild(crearElementoTarea(t)));
      }
    } catch (e) {
      mostrarError(e.message);
    }
  }

  async function actualizarCompletada(id, completada) {
    try {
      const resp = await fetch(API + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ completada }),
      });
      if (!resp.ok) throw new Error("No se pudo actualizar la tarea");
      cargarTareas();
    } catch (e) {
      mostrarError(e.message);
    }
  }

  async function eliminarTarea(id) {
    try {
      const resp = await fetch(API + id, { method: "DELETE" });
      if (!resp.ok) throw new Error("No se pudo eliminar la tarea");
      cargarTareas();
    } catch (e) {
      mostrarError(e.message);
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const titulo = inputTitulo.value.trim();
    if (!titulo) return;

    btnAgregar.disabled = true;
    try {
      const resp = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          titulo,
          descripcion: inputDescripcion.value.trim() || null,
        }),
      });
      if (!resp.ok) throw new Error("No se pudo crear la tarea");
      inputTitulo.value = "";
      inputDescripcion.value = "";
      cargarTareas();
    } catch (e) {
      mostrarError(e.message);
    } finally {
      btnAgregar.disabled = false;
    }
  });

  cargarTareas();
</script>
</body>
</html>
