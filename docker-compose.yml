services:
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: gestor_tareas
    depends_on:
      - mongo
    volumes:
      - ./app:/code/app

volumes:
  mongo_data:
